  - url: https://www.central1.com/in_the_news/central-1-supports-the-credit-union-system-open-banking-solution-provided-by-caspian-one/
    type: Reference
    note: Central 1 (credit-union system rails) supports the Caspian One open-banking solution.
actions:
  apisYmlUpdated: true
  openapiHarvested: false
  reason: |
    No public API surface exists, so apis[] is empty. The record is an honest
    identity-only profile with verified website/legal/social pointers in
    common[]. No spec was harvested because none is publicly downloadable.
