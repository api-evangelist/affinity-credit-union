name: Affinity Credit Union
kind: company
description: >-
  Affinity Credit Union is a member-owned financial cooperative headquartered in
  Saskatoon, Saskatchewan, Canada. Formed in 2005 through the amalgamation of
  several Saskatchewan credit unions, it is the largest credit union in
  Saskatchewan and among the ten largest in Canada, with roughly CAD 9.6 billion
  in managed assets and a province-wide branch and advice-centre network serving
  personal and business members. As a provincially regulated cooperative under
  its "Banking on Values" mandate, members democratically own and govern the
  institution. Affinity exposes NO first-party public developer API or developer
  portal; digital and core banking are delivered through banking-technology
  providers (the credit-union system's Central 1 rails), and third-party consumer
  data access today is aggregator/screen-scraping based. Affinity is a stated
  supporter of the credit-union-system "Open Banking Solution" delivered by
  Caspian One under the Large Credit Union Coalition, positioning it for Canada's
  legislated-but-not-yet-operational Consumer-Driven Banking framework (FCAC).
